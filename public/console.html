<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华冷链监控中心</title><link rel="stylesheet" href="/styles.css"><style>:root{--accent:#1570a6;--accent-soft:#e3f1f8;--nav:#102a3a}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">ZH</span><div>知华冷链<small>COLD CHAIN CONTROL</small></div></div><nav class="nav"><div class="active">运行监控</div><div>运输任务</div><div>温湿度曲线</div><div>异常告警</div><div>车辆与冷箱</div><div>传感器管理</div><div>批次追溯</div><div>合规报告</div></nav><div class="sidebar-foot">上海如静知华信息科技有限公司</div></aside><main class="main"><header class="top"><div><h1>冷链运行监控</h1><div class="muted">在途批次、环境质量和异常处置统一管控</div></div><span class="status"><i class="dot"></i>采集链路正常</span></header><section class="metrics" id="metrics"></section><div class="grid"><section class="card"><div class="section-title"><h2>在途运输任务</h2><button class="button">新建任务</button></div><div class="table-wrap"><table class="table"><thead><tr><th>批次</th><th>货品</th><th>路线</th><th>温区</th><th>状态</th></tr></thead><tbody id="shipments"></tbody></table></div></section><aside class="card"><div class="section-title"><h2>实时告警</h2><span class="muted">需闭环</span></div><div id="alarms"></div></aside></div><div class="grid equal"><section class="card"><div class="section-title"><h2>最新遥测</h2><span class="pill">自动刷新</span></div><div id="telemetry"></div></section><section class="card"><div class="section-title"><h2>设备健康</h2><span class="muted">校准与电量</span></div><div id="sensors"></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const labels={assets:'冷链资产',sensors:'传感器',inTransit:'在途任务',openAlarms:'待处置告警',criticalAlarms:'严重告警',telemetry:'采样点'};metrics.innerHTML=Object.entries(d.metrics).slice(0,5).map(([k,v])=>`<div class="card metric"><span class="muted">${labels[k]}</span><strong>${v}</strong><em>${k.includes('Alarm')&&v?'需要关注':'运行稳定'}</em></div>`).join('');shipments.innerHTML=d.shipments.map(x=>`<tr><td><strong>${esc(x.batchNo)}</strong></td><td>${esc(x.goodsName)}</td><td>${esc(x.origin)} → ${esc(x.destination)}</td><td>${x.thresholds.minTemperature}–${x.thresholds.maxTemperature}℃</td><td><span class="pill ${x.status==='in-transit'?'warning':''}">${esc(x.status)}</span></td></tr>`).join('');alarms.innerHTML=d.alarms.length?d.alarms.map(x=>`<div class="list-row"><div><strong>${esc(x.message)}</strong><span class="muted">${esc(x.type)} · ${x.occurrences}次</span></div><span class="pill ${x.severity==='critical'?'danger':'warning'}">${esc(x.status)}</span></div>`).join(''):'<div class="empty">暂无异常</div>';telemetry.innerHTML=d.telemetry.map(x=>`<div class="list-row"><div><strong>${x.temperature}℃ · ${x.humidity}%RH</strong><span class="muted">${new Date(x.reportedAt).toLocaleTimeString('zh-CN')} · ${esc(x.sensorId)}</span></div><span class="pill ${x.temperature>8?'danger':''}">${x.doorOpen?'箱门开启':'箱门关闭'}</span></div>`).join('');sensors.innerHTML=d.sensors.map(x=>`<div class="list-row"><div><strong>${esc(x.code)}</strong><span class="muted">校准到期 ${new Date(x.calibrationDueAt).toLocaleDateString('zh-CN')}</span></div><strong>${x.batteryPercent}%</strong></div>`).join('')})</script></body></html>
